<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDevlog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="amberGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowDevlog" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgGradDevlog)" />
  
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Central Processing Engine: FastAPI + Jinja2 Core -->
  <rect x="270" y="145" width="260" height="205" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glowDevlog)" />
  <text x="400" y="190" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#f8fafc" text-anchor="middle">FASTAPI + JINJA2 CORE</text>
  <text x="400" y="213" font-family="monospace" font-size="12" fill="#38bdf8" text-anchor="middle">SSR &amp; REST PUBLISHING API</text>

  <!-- Sub modules inside Core -->
  <rect x="295" y="235" width="65" height="42" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="327" y="260" font-family="monospace" font-size="10" fill="#bae6fd" text-anchor="middle">Jinja2</text>

  <rect x="368" y="235" width="65" height="42" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
  <text x="400" y="260" font-family="monospace" font-size="10" fill="#e0e7ff" text-anchor="middle">JWT Auth</text>

  <rect x="440" y="235" width="65" height="42" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
  <text x="472" y="260" font-family="monospace" font-size="10" fill="#fef3c7" text-anchor="middle">Boto3 S3</text>

  <!-- Bottom Container Pill -->
  <rect x="305" y="295" width="190" height="26" rx="13" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
  <text x="400" y="312" font-family="monospace" font-size="10" font-weight="bold" fill="#e0f2fe" text-anchor="middle">Docker Compose Topology</text>

  <!-- Left: Ingress & Gateway -->
  <rect x="60" y="175" width="145" height="55" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <text x="132" y="200" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">Nginx Ingress</text>
  <text x="132" y="217" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Reverse Proxy / SSL</text>

  <rect x="60" y="265" width="145" height="55" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
  <text x="132" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" text-anchor="middle">JWT Auth Layer</text>
  <text x="132" y="307" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Role-Based Access</text>

  <!-- Right: Storage & Cloud Layer -->
  <rect x="595" y="175" width="145" height="55" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="667" y="200" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">PostgreSQL DB</text>
  <text x="667" y="217" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Posts, Tags &amp; Comments</text>

  <rect x="595" y="265" width="145" height="55" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="667" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde68a" text-anchor="middle">AWS S3 + Boto3</text>
  <text x="667" y="307" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Media Asset Pipeline</text>

  <!-- Connecting Lines -->
  <path d="M 205 202 L 270 220" stroke="url(#blueGlow)" stroke-width="2.5" stroke-dasharray="6,4" fill="none" />
  <path d="M 205 292 L 270 260" stroke="url(#blueGlow)" stroke-width="2.5" stroke-dasharray="6,4" fill="none" />

  <path d="M 530 220 L 595 202" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" fill="none" />
  <path d="M 530 260 L 595 292" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" fill="none" />

  <!-- Top Badge -->
  <rect x="30" y="30" width="180" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="48" cy="46" r="4" fill="#38bdf8" />
  <text x="62" y="51" font-family="monospace" font-size="11" font-weight="bold" fill="#f8fafc">DEVLOG ARCHITECTURE</text>

  <!-- Bottom Metric -->
  <text x="400" y="435" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">FastAPI • PostgreSQL • AWS S3 / Boto3 • Jinja2 • Nginx • Docker • JWT</text>
</svg>
