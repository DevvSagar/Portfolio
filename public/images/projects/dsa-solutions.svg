<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDsa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glowDsa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgGradDsa)" />
  
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Central Algorithm & Tree Graph Structure -->
  <!-- Root Node -->
  <circle cx="400" cy="160" r="26" fill="#1c1917" stroke="#f59e0b" stroke-width="2" filter="url(#glowDsa)" />
  <text x="400" y="166" font-family="monospace" font-size="14" font-weight="bold" fill="#fef3c7" text-anchor="middle">ROOT</text>

  <!-- Tree Edge Lines -->
  <line x1="382" y1="180" x2="310" y2="240" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3" />
  <line x1="418" y1="180" x2="490" y2="240" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3" />
  <line x1="295" y1="262" x2="240" y2="320" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="325" y1="262" x2="360" y2="320" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="475" y1="262" x2="440" y2="320" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="505" y1="262" x2="560" y2="320" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Level 1 Nodes -->
  <circle cx="300" cy="250" r="22" fill="#1c1917" stroke="#ea580c" stroke-width="2" />
  <text x="300" y="255" font-family="monospace" font-size="12" font-weight="bold" fill="#ffedd5" text-anchor="middle">BST</text>

  <circle cx="500" cy="250" r="22" fill="#1c1917" stroke="#ea580c" stroke-width="2" />
  <text x="500" y="255" font-family="monospace" font-size="12" font-weight="bold" fill="#ffedd5" text-anchor="middle">GRAPH</text>

  <!-- Level 2 Nodes -->
  <circle cx="230" cy="330" r="18" fill="#0c0a09" stroke="#fbbf24" stroke-width="1.5" />
  <text x="230" y="334" font-family="monospace" font-size="10" font-weight="bold" fill="#fde68a" text-anchor="middle">O(1)</text>

  <circle cx="370" cy="330" r="18" fill="#0c0a09" stroke="#fbbf24" stroke-width="1.5" />
  <text x="370" y="334" font-family="monospace" font-size="10" font-weight="bold" fill="#fde68a" text-anchor="middle">DP</text>

  <circle cx="430" cy="330" r="18" fill="#0c0a09" stroke="#fbbf24" stroke-width="1.5" />
  <text x="430" y="334" font-family="monospace" font-size="10" font-weight="bold" fill="#fde68a" text-anchor="middle">DFS</text>

  <circle cx="570" cy="330" r="18" fill="#0c0a09" stroke="#fbbf24" stroke-width="1.5" />
  <text x="570" y="334" font-family="monospace" font-size="10" font-weight="bold" fill="#fde68a" text-anchor="middle">BFS</text>

  <!-- Left Side Badge: Complexity Analysis -->
  <rect x="50" y="200" width="130" height="60" rx="12" fill="#1c1917" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <text x="115" y="225" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">Time Complexity</text>
  <text x="115" y="244" font-family="monospace" font-size="11" fill="#fed7aa" text-anchor="middle">O(N log N) / O(1)</text>

  <!-- Right Side Badge: Daily Commitment -->
  <rect x="620" y="200" width="130" height="60" rx="12" fill="#1c1917" stroke="#10b981" stroke-width="1.5" />
  <text x="685" y="225" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Daily Progress</text>
  <text x="685" y="244" font-family="monospace" font-size="11" fill="#a7f3d0" text-anchor="middle">Active Streak</text>

  <!-- Top Badge -->
  <rect x="30" y="30" width="180" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="48" cy="46" r="4" fill="#f59e0b" />
  <text x="62" y="51" font-family="monospace" font-size="11" font-weight="bold" fill="#fef3c7">DATA STRUCTURES &amp; ALGO</text>

  <!-- Bottom Metric -->
  <text x="400" y="435" font-family="monospace" font-size="13" fill="#a8a29e" text-anchor="middle">Arrays • Trees • Graphs • DP • System Complexity • LeetCode</text>
</svg>
