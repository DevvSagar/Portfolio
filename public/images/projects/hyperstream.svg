<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bgGrad1)" />
  
  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Central Processing Engine Node -->
  <rect x="280" y="160" width="240" height="180" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
  <text x="400" y="210" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">STREAM BROKER CLUSTER</text>
  <text x="400" y="235" font-family="monospace" font-size="13" fill="#38bdf8" text-anchor="middle">250,000+ QPS INGESTION</text>

  <!-- Partitions -->
  <rect x="310" y="260" width="55" height="45" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="337" y="287" font-family="monospace" font-size="11" fill="#bae6fd" text-anchor="middle">P0</text>
  
  <rect x="373" y="260" width="55" height="45" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="400" y="287" font-family="monospace" font-size="11" fill="#bae6fd" text-anchor="middle">P1</text>

  <rect x="435" y="260" width="55" height="45" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="462" y="287" font-family="monospace" font-size="11" fill="#bae6fd" text-anchor="middle">P2</text>

  <!-- Input Ingestion Nodes -->
  <rect x="70" y="190" width="130" height="55" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <text x="135" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Producer Ingress</text>

  <rect x="70" y="270" width="130" height="55" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <text x="135" y="302" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Telemetry Feed</text>

  <!-- Output Consumer Sinks -->
  <rect x="600" y="190" width="130" height="55" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="665" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">Analytics Sink</text>

  <rect x="600" y="270" width="130" height="55" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="665" y="302" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">Realtime Cache</text>

  <!-- Data Flow Connecting Lines -->
  <path d="M 200 217 L 280 230" stroke="url(#cyanGlow)" stroke-width="3" stroke-dasharray="6,4" fill="none" />
  <path d="M 200 297 L 280 270" stroke="url(#cyanGlow)" stroke-width="3" stroke-dasharray="6,4" fill="none" />

  <path d="M 520 230 L 600 217" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" fill="none" />
  <path d="M 520 270 L 600 297" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" fill="none" />

  <!-- Top Badge -->
  <rect x="30" y="30" width="140" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="48" cy="46" r="4" fill="#34d399" />
  <text x="62" y="51" font-family="monospace" font-size="11" font-weight="bold" fill="#e2e8f0">GO / KAFKA</text>

  <!-- Bottom Metric -->
  <text x="400" y="440" font-family="monospace" font-size="14" fill="#94a3b8" text-anchor="middle">p99 Latency: 11.4ms | Throughput: 284k events/sec</text>
</svg>
