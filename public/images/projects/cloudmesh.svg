<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#1e1e24" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#meshGrad)" />

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Ingress Gateway Core -->
  <rect x="250" y="150" width="300" height="200" rx="20" fill="#27272a" stroke="#a855f7" stroke-width="2" />
  <text x="400" y="200" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">gRPC API GATEWAY</text>
  <text x="400" y="225" font-family="monospace" font-size="13" fill="#c084fc" text-anchor="middle">HTTP/3 + PROTOBUF + mTLS</text>

  <!-- Circuit Breaker & Rate Limiter Blocks -->
  <rect x="280" y="250" width="110" height="60" rx="10" fill="#18181b" stroke="#71717a" stroke-width="1" />
  <text x="335" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#e4e4e7" text-anchor="middle">Token Bucket</text>
  <text x="335" y="295" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">Redis Cluster</text>

  <rect x="410" y="250" width="110" height="60" rx="10" fill="#18181b" stroke="#71717a" stroke-width="1" />
  <text x="465" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#e4e4e7" text-anchor="middle">Circuit Breaker</text>
  <text x="465" y="295" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">Auto-Failover</text>

  <!-- Client Traffic Inflow -->
  <rect x="50" y="220" width="130" height="60" rx="12" fill="#18181b" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <text x="115" y="248" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e4e4e7" text-anchor="middle">Edge Clients</text>
  <text x="115" y="265" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">15M+ Req/Day</text>

  <!-- Downstream Microservices -->
  <rect x="620" y="150" width="130" height="50" rx="10" fill="#18181b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="685" y="180" font-family="monospace" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle">auth-svc :50051</text>

  <rect x="620" y="225" width="130" height="50" rx="10" fill="#18181b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="685" y="255" font-family="monospace" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle">billing-svc :50052</text>

  <rect x="620" y="300" width="130" height="50" rx="10" fill="#18181b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="685" y="330" font-family="monospace" font-size="12" font-weight="600" fill="#93c5fd" text-anchor="middle">orders-svc :50053</text>

  <!-- Connections -->
  <path d="M 180 250 L 250 250" stroke="url(#purpleGlow)" stroke-width="3" stroke-dasharray="6,4" fill="none" />
  <path d="M 550 220 L 620 175" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5,3" fill="none" />
  <path d="M 550 250 L 620 250" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5,3" fill="none" />
  <path d="M 550 280 L 620 325" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5,3" fill="none" />

  <!-- Top Badge -->
  <rect x="30" y="30" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
  <circle cx="48" cy="46" r="4" fill="#a855f7" />
  <text x="62" y="51" font-family="monospace" font-size="11" font-weight="bold" fill="#e2e8f0">gRPC / REDIS</text>

  <!-- Bottom Metric -->
  <text x="400" y="440" font-family="monospace" font-size="14" fill="#a1a1aa" text-anchor="middle">40% Latency Reduction | Zero Single Point of Failure</text>
</svg>
